# Instruments configuration for feed.py WebSocket producer.
# Master files: /home/trading_ceo/antariksh/data/masters/{NSE,NFO,BFO,MCX,BSE}_symbols.txt
#
# ┌─ Permanent (never expire) ───────────────────────────────────────────────┐
# │ Index spot feeds — one-permanent token per index                        │
# └──────────────────────────────────────────────────────────────────────────┘
#
# ┌─ Monthly (roll at month-end) ────────────────────────────────────────────┐
# │ Index futures — NFO|62329 (NIFTY Jun), BFO|1105863 (SENSEX Jun)        │
# │ Update on the last expiry-day-of-month                                  │
# └──────────────────────────────────────────────────────────────────────────┘
#
# ┌─ Weekly ATM options (resolve at startup) ────────────────────────────────┐
# │ Computed from master files at feed.py startup + every expiry-day at 09:15│
# │ NIFTY: Tuesday expiry, SENSEX: Thursday expiry                          │
# └──────────────────────────────────────────────────────────────────────────┘

spot:
  - name: NIFTY
    exchange: NSE
    token: "26000"
    feed_type: t
    market_open: "09:15"
    market_close: "15:30"

  - name: SENSEX
    exchange: BSE
    token: "1"
    feed_type: t
    market_open: "09:15"
    market_close: "15:30"

  - name: INDIAVIX
    exchange: NSE
    token: "26017"
    feed_type: t
    market_open: "09:15"
    market_close: "15:30"

