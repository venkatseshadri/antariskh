weekly_options:
  enabled: true
  atm_range: 5          # ±N strikes from ATM
  indices:
    - index: NIFTY
      exchange: NFO
      feed_type: d
      expiry_weekday: 1   # Tuesday
      master_file: NFO_symbols.txt
      strike_gap: 50
      # tsym format:  NIFTY{DD}{Mmm}{YY}{C/P}{5-digit-strike}
      # example:      NIFTY02JUN26C23950
      tsym_pattern: "NIFTY{dd}{mmmyy}{cp}{strike:05d}"

    - index: SENSEX
      exchange: BFO
      feed_type: d
      expiry_weekday: 3   # Thursday
      master_file: BFO_symbols.txt
      strike_gap: 100
      # tsym weekly format: SENSEX{YY}{M}{DD}{5-digit-strike}{CE/PE}
      # example:            SENSEX2660475800PE  (04-JUN-2026, 75800 PE)
      tsym_pattern: "SENSEX{yy}{m}{dd}{strike:05d}{cepe}"

monthly_options:
  enabled: true
  atm_range: 5
  indices:
    - index: SENSEX
      exchange: BFO
      feed_type: d
      master_file: BFO_symbols.txt
      strike_gap: 100
      # tsym monthly format: SENSEX{YY}{Mmm}{5-digit-strike}{CE/PE}
      # example:             SENSEX26JUN75800PE  (25-JUN-2026)
      tsym_pattern: "SENSEX{yy}{mmm}{strike:05d}{cepe}"
